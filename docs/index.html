<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Regionais - Departamentos OPA | UNI Internet</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface-hover: #222632;
    --card-top-bg: linear-gradient(135deg, #1e2230, #262a38);
    --border: #2a2e3a;
    --text: #e4e6ed;
    --text-muted: #8b90a0;
    --heading-color: #fff;
    --accent: #21d9ff;
    --accent-glow: rgba(33, 217, 255, 0.15);
    --accent-text: #000;
    --green: #34d399;
    --green-bg: rgba(52, 211, 153, 0.1);
    --green-border: rgba(52, 211, 153, 0.15);
    --green-icon: rgba(52, 211, 153, 0.2);
    --blue: #60a5fa;
    --blue-bg: rgba(96, 165, 250, 0.1);
    --blue-border: rgba(96, 165, 250, 0.15);
    --blue-icon: rgba(96, 165, 250, 0.2);
    --purple: #a78bfa;
    --purple-bg: rgba(167, 139, 250, 0.08);
    --purple-border: rgba(167, 139, 250, 0.2);
    --orange: #fb923c;
    --orange-bg: rgba(251, 146, 60, 0.1);
    --orange-border: rgba(251, 146, 60, 0.15);
    --orange-icon: rgba(251, 146, 60, 0.2);
    --shadow-hover: rgba(0,0,0,0.3);
    --addr-bg: #161922;
    --radius: 14px;
  }

  [data-theme="light"] {
    --bg: #f0f2f5;
    --surface: #ffffff;
    --surface-hover: #f5f6f8;
    --card-top-bg: linear-gradient(135deg, #e8ecf2, #f1f4f9);
    --border: #dde1e8;
    --text: #2d3142;
    --text-muted: #6b7280;
    --heading-color: #1a1d27;
    --accent: #0aafc9;
    --accent-glow: rgba(10, 175, 201, 0.1);
    --accent-text: #fff;
    --green: #059669;
    --green-bg: rgba(5, 150, 105, 0.07);
    --green-border: rgba(5, 150, 105, 0.15);
    --green-icon: rgba(5, 150, 105, 0.12);
    --blue: #2563eb;
    --blue-bg: rgba(37, 99, 235, 0.06);
    --blue-border: rgba(37, 99, 235, 0.15);
    --blue-icon: rgba(37, 99, 235, 0.1);
    --purple: #7c3aed;
    --purple-bg: rgba(124, 58, 237, 0.06);
    --purple-border: rgba(124, 58, 237, 0.15);
    --orange: #ea580c;
    --orange-bg: rgba(234, 88, 12, 0.07);
    --orange-border: rgba(234, 88, 12, 0.15);
    --orange-icon: rgba(234, 88, 12, 0.12);
    --shadow-hover: rgba(0,0,0,0.08);
    --addr-bg: #f8f9fb;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Poppins', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
    transition: background 0.4s ease, color 0.4s ease;
  }

  .theme-toggle {
    position: fixed;
    top: 20px;
    right: 24px;
    z-index: 100;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 50px;
    padding: 8px 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'Poppins', sans-serif;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--text);
    transition: all 0.3s ease;
    box-shadow: 0 2px 12px rgba(0,0,0,0.15);
  }
  .theme-toggle:hover { transform: scale(1.05); box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
  .theme-toggle .icon { font-size: 1.1rem; }

  .header {
    text-align: center;
    padding: 50px 20px 40px;
    position: relative;
    overflow: hidden;
  }
  .header::before {
    content: '';
    position: absolute;
    top: -50%;
    left: 50%;
    transform: translateX(-50%);
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
    pointer-events: none;
  }

  .logo-container { position: relative; margin-bottom: 20px; }
  .logo-placeholder {
    width: 220px; height: auto; margin: 0 auto;
    display: flex; align-items: center; justify-content: center;
}
.logo-placeholder img { width: 100%; height: auto; object-fit: contain; }

  [data-theme="dark"] .logo-dark { display: block; }
  [data-theme="dark"] .logo-light { display: none; }
  [data-theme="light"] .logo-dark { display: none; }
  [data-theme="light"] .logo-light { display: block; }

  .header h1 {
    font-family: 'Poppins', sans-serif;
    font-size: clamp(1.8rem, 5vw, 3rem);
    font-weight: 800; color: var(--accent);
    position: relative; letter-spacing: -0.5px;
  }
  .header p {
    color: var(--text-muted); font-size: 1rem;
    margin-top: 6px; position: relative; font-weight: 500;
  }

  .calc-link {
    display: inline-flex; align-items: center; gap: 8px;
    margin-top: 18px; padding: 10px 20px; position: relative;
    border-radius: 50px; background: var(--surface); border: 1px solid var(--border);
    color: var(--accent); font-weight: 600; font-size: 0.85rem;
    text-decoration: none; transition: transform 0.3s ease, box-shadow 0.3s ease;
  }
  .calc-link:hover { transform: translateY(-2px); box-shadow: 0 8px 20px var(--shadow-hover); }
  .calc-link .icon {
    display: inline-grid; place-items: center; width: 20px; height: 20px;
    border-radius: 50%; background: var(--accent-glow); color: var(--accent);
    font-weight: 800; font-size: 0.75rem;
  }

  .legend {
    max-width: 1280px; margin: 0 auto 24px; padding: 0 24px;
    display: flex; gap: 20px; flex-wrap: wrap; justify-content: center;
  }
  .legend-item {
    display: flex; align-items: center; gap: 6px;
    font-size: 0.78rem; color: var(--text-muted); font-weight: 500;
  }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; }
  .legend-line { width: 24px; height: 0; border-top: 1px dashed var(--text-muted); }

  .grid {
    max-width: 1280px; margin: 0 auto;
    padding: 0 24px 80px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(370px, 1fr));
    gap: 24px;
  }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden;
    transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.4s ease;
    animation: fadeUp 0.5s ease both;
  }
  .card:hover { transform: translateY(-4px); box-shadow: 0 12px 40px var(--shadow-hover); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .card:nth-child(1)  { animation-delay: 0.03s; }
  .card:nth-child(2)  { animation-delay: 0.06s; }
  .card:nth-child(3)  { animation-delay: 0.09s; }
  .card:nth-child(4)  { animation-delay: 0.12s; }
  .card:nth-child(5)  { animation-delay: 0.15s; }
  .card:nth-child(6)  { animation-delay: 0.18s; }
  .card:nth-child(7)  { animation-delay: 0.21s; }
  .card:nth-child(8)  { animation-delay: 0.24s; }
  .card:nth-child(9)  { animation-delay: 0.27s; }
  .card:nth-child(10) { animation-delay: 0.30s; }

  .card-top {
    background: var(--card-top-bg); padding: 20px 24px;
    border-bottom: 1px solid var(--border); position: relative;
    transition: background 0.4s ease;
  }
  .card-top::after {
    content: ''; position: absolute; bottom: 0; left: 24px; right: 24px;
    height: 2px; background: linear-gradient(90deg, var(--accent), transparent);
  }

  .filial-badge {
    display: inline-block; background: var(--accent); color: var(--accent-text);
    font-weight: 700; font-size: 0.72rem; padding: 3px 10px;
    border-radius: 20px; letter-spacing: 0.5px;
    text-transform: uppercase; margin-bottom: 8px;
  }
  .card-top h2 {
    font-family: 'Poppins', sans-serif; font-size: 1.25rem;
    font-weight: 700; color: var(--heading-color); margin-bottom: 4px;
  }
  .dept-opa {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--purple-bg); border: 1px solid var(--purple-border);
    padding: 4px 12px; border-radius: 8px; font-size: 0.78rem;
    color: var(--purple); font-weight: 600; margin-top: 8px;
  }
  .dept-opa::before { content: '\25C6'; font-size: 0.55rem; }

  .card-body { padding: 20px 24px 24px; }

  .people { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
  .person {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 14px; border-radius: 10px; font-size: 0.9rem;
    transition: background 0.3s ease;
  }
  .person.gerente { background: var(--green-bg); border: 1px solid var(--green-border); }
  .person.supervisor { background: var(--blue-bg); border: 1px solid var(--blue-border); }
  .person.operacional { background: var(--orange-bg); border: 1px solid var(--orange-border); }

  .person-icon {
    width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.7rem; font-weight: 700; flex-shrink: 0;
  }
  .gerente .person-icon { background: var(--green-icon); color: var(--green); }
  .supervisor .person-icon { background: var(--blue-icon); color: var(--blue); }
  .operacional .person-icon { background: var(--orange-icon); color: var(--orange); }

  .person-info { display: flex; flex-direction: column; }
  .person-role {
    font-size: 0.66rem; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.8px;
  }
  .gerente .person-role { color: var(--green); }
  .supervisor .person-role { color: var(--blue); }
  .operacional .person-role { color: var(--orange); }
  .person-name { font-weight: 600; color: var(--heading-color); font-size: 0.9rem; }

  .cities-label {
    font-size: 0.68rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: 1px; color: var(--text-muted); margin-bottom: 10px;
    display: flex; align-items: center; gap: 6px;
  }
  .cities-label::before {
    content: ''; display: block; width: 14px; height: 1px; background: var(--text-muted);
  }

  .cities-list { display: flex; flex-direction: column; gap: 6px; }

  .city-row { position: relative; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

  .maps-link {
    display: inline-flex; align-items: center; justify-content: center;
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--surface-hover); border: 1px solid var(--border);
    text-decoration: none; font-size: 0.8rem;
    transition: all 0.2s ease; flex-shrink: 0;
  }
  .maps-link:hover {
    border-color: var(--accent); background: var(--accent-glow);
    transform: scale(1.1);
  }

  .city-tag {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--surface-hover); border: 1px solid var(--border);
    padding: 5px 12px; border-radius: 20px; font-size: 0.78rem;
    color: var(--text-muted); font-weight: 500;
    transition: all 0.2s ease;
  }
  .city-tag.distrito, .city-tag.aldeia { font-style: italic; border-style: dashed; }


  .city-tag.has-addr {
    cursor: pointer;
    padding-right: 10px;
  }
  .city-tag.has-addr:hover {
    border-color: var(--accent); color: var(--accent); background: var(--accent-glow);
  }
  .city-tag.has-addr .pin { margin-right: 2px; font-style: normal; }
  .city-tag.has-addr .arrow {
    display: inline-block; font-size: 0.6rem; margin-left: 4px;
    transition: transform 0.3s ease; font-style: normal;
  }
  .city-tag.has-addr.open .arrow { transform: rotate(180deg); }
  .city-tag.has-addr.open {
    border-color: var(--accent); color: var(--accent); background: var(--accent-glow);
    border-radius: 12px 12px 0 0;
  }

  .addr-panel {
    flex-basis: 100%; width: 100%;
    max-height: 0; overflow: hidden;
    transition: max-height 0.35s ease, padding 0.35s ease, opacity 0.25s ease;
    opacity: 0;
    background: var(--addr-bg);
    border: 1px solid var(--border); border-top: none;
    border-radius: 0 0 12px 12px;
    margin-top: -1px;
    padding: 0 14px;
  }
  .addr-panel.open {
    max-height: 200px; opacity: 1; padding: 10px 14px;
  }
  .addr-panel .addr-line {
    display: flex; align-items: flex-start; gap: 8px;
    font-size: 0.76rem; color: var(--text-muted); line-height: 1.5;
  }
  .addr-panel .addr-line + .addr-line { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border); }
  .addr-panel .addr-icon { flex-shrink: 0; font-size: 0.85rem; margin-top: 1px; }
  .addr-panel .addr-label {
    font-size: 0.62rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.5px; color: var(--accent); margin-bottom: 2px;
  }

  @media (max-width: 480px) {
    .grid { grid-template-columns: 1fr; padding: 0 12px 60px; gap: 16px; }
    .header { padding: 40px 16px 28px; }
    .theme-toggle { top: 12px; right: 12px; padding: 6px 12px; font-size: 0.72rem; }
    .logo-placeholder { width: 90px; height: 90px; }
  }
</style>
</head>

function renderCards() {
  const grid = document.getElementById('grid');
  grid.innerHTML = filiais.map((f, fi) => {
    const cidadesHTML = f.cidades.map((c, ci) => {
      const id = `addr-${fi}-${ci}`;
      const hasAddr = c.addrs && c.addrs.length > 0;
      const distritoClass = c.distrito ? ' distrito' : (c.aldeia ? ' aldeia' : '');
const suffix = c.distrito ? (c.vila ? ' (Vila)' : ' (Distrito)') : (c.aldeia ? ' (Aldeia)' : '');

      const mapsLinkHTML = c.coords
        ? `<a class="maps-link" href="https://www.google.com/maps?q=${c.coords.lat},${c.coords.lng}" target="_blank" rel="noopener" title="Abrir no Google Maps" onclick="event.stopPropagation()">🗺️</a>`
        : '';

      if (!hasAddr) {
        return `<div class="city-row"><span class="city-tag${distritoClass}">${c.nome}${suffix}</span>${mapsLinkHTML}</div>`;
      }

      const addrLines = c.addrs.map(a => {
        const labelHTML = a.label ? `<div class="addr-label">${a.label}</div>` : '';
        return `<div class="addr-line"><span class="addr-icon">📍</span><div>${labelHTML}${a.end}</div></div>`;
      }).join('');

      return `<div class="city-row">
        <span class="city-tag has-addr${distritoClass}" onclick="toggleAddr('${id}', this)">
          <span class="pin">📍</span>${c.nome}${suffix}<span class="arrow">▼</span>
        </span>${mapsLinkHTML}
        <div class="addr-panel" id="${id}">${addrLines}</div>
      </div>`;
    }).join('');

    return `<div class="card">
      <div class="card-top">
        <span class="filial-badge">Filial ${f.num}</span>
        <h2>UNI — ${f.nome}</h2>
        <div class="dept-opa">Depto OPA: (${f.sigla}) ${f.regional}</div>
      </div>
      <div class="card-body">
        <div class="people">
          <div class="person gerente">
            <div class="person-icon">GU</div>
            <div class="person-info">
              <span class="person-role">Gerente da Unidade</span>
              <span class="person-name">${f.gerente}</span>
            </div>
          </div>
          <div class="person supervisor">
            <div class="person-icon">SC</div>
            <div class="person-info">
              <span class="person-role">Supervisor Comercial</span>
              <span class="person-name">${f.supervisor}</span>
            </div>
          </div>
          <div class="person operacional">
            <div class="person-icon">SO</div>
            <div class="person-info">
              <span class="person-role">Supervisor Operacional</span>
              <span class="person-name">${f.operacional}</span>
            </div>
          </div>
        </div>
        <div class="cities-label">Cidades e Distritos Atendidos</div>
        <div class="cities-list">${cidadesHTML}</div>
      </div>
    </div>`;
  }).join('');
}

function toggleAddr(id, el) {
  const panel = document.getElementById(id);
  const isOpen = panel.classList.contains('open');
  // Close all panels first
  document.querySelectorAll('.addr-panel.open').forEach(p => {
    p.classList.remove('open');
    p.previousElementSibling.classList.remove('open');
  });
  if (!isOpen) {
    panel.classList.add('open');
    el.classList.add('open');
  }
}

function toggleTheme() {
  const html = document.documentElement;
  const icon = document.getElementById('themeIcon');
  const label = document.getElementById('themeLabel');
  if (html.getAttribute('data-theme') === 'dark') {
    html.setAttribute('data-theme', 'light');
    icon.textContent = '🌙';
    label.textContent = 'Modo Escuro';
  } else {
    html.setAttribute('data-theme', 'dark');
    icon.textContent = '☀️';
    label.textContent = 'Modo Claro';
  }
}

renderCards();
</script>
